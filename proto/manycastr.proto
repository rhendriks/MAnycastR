syntax = "proto3";
package manycastr;

// The controller which controls and is responsible for most communication
service Controller {
  // Worker lets the Orc know the measurement is finished
  rpc MeasurementFinished(Finished) returns (Ack) {}
  // Worker connects with the Orc, which returns a stream for future instructions
  rpc WorkerConnect(Worker) returns (stream Instruction) {}
  // CLI instructs Orc to perform a hitlist-based measurement and establishes a stream for the Orc to send back replies
  rpc DoMeasurement(ScheduleMeasurement) returns (stream ReplyBatch) {}
  // CLI opens a live measurement, replies are streamed back
  rpc LiveMeasurement(stream CliMessage) returns (stream ReplyBatch) {}
  // CLI asks Orc its current status (list of connected workers and measurements)
  rpc ListWorkers(Empty) returns (Status) {}
  // Worker sends measurement replies to the Orc
  rpc SendResult(ReplyBatch) returns (Ack) {}
}

// Empty message
message Empty {}

// Acknowledgement of a measurement with a boolean whether it was successful or not and a possible error message.
message Ack {
  bool is_success = 1;
  string error_message = 2;
}

// Finished message, sent by a worker to the orchestrator when a measurement is finished, or as acknowledgement of a received task result
message Finished {
  uint32 m_id = 1;
  uint32 worker_id = 2;
}

enum MeasurementType {
  LACES = 0;
  CATCHMENT = 1;
  ANYCAST_LATENCY = 2; // TODO rename to 'LATENCY'
  ANYCAST_TRACEROUTE = 3; // TODO rename to 'TRACEROUTE' and implement unicast traceroute
  TRACEMAP = 4;
}

enum ProtocolType {
  ICMP = 0;
  A_DNS = 1;
  TCP = 2;
  CHAOS_DNS = 3;
}

// Connection/participation status of a worker
enum WorkerStatus {
  IDLE = 0;         // Connected but not participating in a measurement
  PROBING = 1;      // Sending probes and listening for replies for a measurement
  LISTENING = 2;    // Only listening for replies for a measurement
  DISCONNECTED = 3; // Lost connection
}

// Schedule a measurement with the orchestrator
message ScheduleMeasurement {
  uint32 probing_rate = 1; // Probing rate (probes per second)
  repeated Configuration configurations = 2; // Configuration of worker and origin combinations
  uint32 worker_interval = 3; // interval between probes from different workers
  MeasurementType m_type = 4;
  repeated Address hitlist = 5; // target addresses to probe
  optional string record = 6; // Record to send CHAOS (TXT) or A/AAAA requests for
  optional string url = 7; // URL to encode in probes (e.g., opt-out link)
  uint32 probe_interval = 8; // interval between probes from/to the same origin,dst pair
  uint32 number_of_probes = 9; // number of probes to send per origin,dst pair
  bool is_record = 10; // whether to send IPv4 probes with the Record Route options
  optional TraceOptions trace_options = 11; // Optional traceroute options
  bool is_responsive = 12; // Whether to probe a target once for responsiveness before sending measurement probes
  bool is_any_protocol = 13; // Try protocols in order; stop per-target on first responsive protocol
}

// A message sent by the CLI on a live measurement stream
message CliMessage {
  oneof message {
    ScheduleMeasurement start = 1; // measurement definition (must be the first message; hitlist is ignored)
    TargetBatch targets = 2; // targets to probe using the measurement defaults
  }
}

// A batch of live-feed targets
message TargetBatch {
  repeated LiveTarget targets = 1;
}

// A live-feed target with an optional worker and origin assignment
message LiveTarget {
  Address dst = 1; // target address to probe
  uint32 worker_id = 2; // 0 = any worker (round-robin, default), u32::MAX = all probing workers, otherwise a specific worker ID
  uint32 origin_id = 3; // origin to send from: u32::MAX = all origins (default, set by the CLI), otherwise a specific origin ID
  uint32 nprobes = 4; // number of measurement probes to send (always >= 1, default 1 set by the CLI)
}

// A list of workers
message Status {
  repeated Worker workers = 1;
}

// Worker definition, contains a worker ID, metadata (hostname), status
message Worker {
  uint32 worker_id = 1;
  string hostname = 2;
  WorkerStatus status = 3;
  Address unicast_v6 = 4;
  Address unicast_v4 = 5;
}

// Address message, can be either an IPv4 or IPv6 address
message Address {
  oneof value {
    fixed32 v4 = 1;
    IPv6 v6 = 2;
    Empty unicast_v4 = 3; // use the worker's local IPv4 unicast address
    Empty unicast_v6 = 4; // use the worker's local IPv6 unicast address
  }
}

// IPv6 address message (protobuf does not support 128 bit values)
message IPv6 {
  fixed64 high = 1; // most significant 64 bits
  fixed64 low = 2; // least significant 64 bits
}


// A task for a worker, either a start or end message, a list of targets, or a traceroute task
message Instruction {
  oneof instruction_type {
    End end = 1; // End measurement [control]
    Start start = 2; // Start measurement [control]
    Init init = 3; // Initial message to worker (contains worker ID) [control]
    Tasks tasks = 4; // List of tasks (probes/traceroutes) to perform [measurement]
  }
}

// A list of tasks (i.e., measurements) for a worker to perform
message Tasks {
  repeated Task tasks = 1;
}

// A task (i.e., measurement) for a worker to perform, either a probe, traceroute, or discovery task
message Task {
  oneof task_type {
    Probe probe = 1; // A probe task (e.g., regular ping)
    Trace trace = 2; // A traceroute task (to a specific TTL)
    Probe discovery = 3; // A discovery task (e.g., to check for responsiveness or catching PoP)
  }
  uint32 origin_id = 4; // Origin from which to send this probe
  uint32 nprobes = 5; // number of times the worker sends this probe, spaced by the Start probe_interval (set to 1 for discovery/trace tasks)
}

// Initial message to worker, contains the worker ID assigned by the orchestrator
message Init {
  uint32 worker_id = 1;
}

// A start control instruction, forwards the configuration to the worker
message Start {
  uint32 rate = 1;
  uint32 m_id = 2;
  repeated Origin tx_origins = 3; // origins to send with
  repeated Origin rx_origins = 4; // origins to listen for
  optional string record = 5; // domain to use for DNS queries (TXT/A/AAAA)
  optional string url = 6; // URL encoded in probes
  bool is_record = 7; // send IPv4 probes with the Record Route option
  MeasurementType m_type = 8; // Measurement type
  uint32 probe_interval = 9; // seconds between repeated sends of a task with nprobes > 1
}

message TraceOptions {
  uint32 max_failures = 1; // Maximum number of consecutive timeouts before terminating the traceroute
  uint32 max_hops = 2; // Maximum number of hops to discover (to avoid routing loops)
  uint32 timeout = 3; // Maximum time to wait for trace replies before triggering timeout (in seconds)
  uint32 initial_hop = 4; // Initial TTL value for traceroute measurements
  bool star_unresponsive = 5; // Emit a '*' hop (no reply) to the CLI when a hop times out
}

// An end message, indicates the worker should stop sending out probes
message End {
  uint32 code = 1; // 0 -> finished, 1 -> CLI disconnect
}

// Origin: mapping of source address, port values, protocol type, and an identifier
message Origin {
  Address src = 1;
  uint32 sport = 2;
  uint32 dport = 3;
  uint32 origin_id = 4;
  ProtocolType p_type = 5; // Protocol type to use for this origin
}

// Configuration: mapping of worker ID to origin
message Configuration {
  Origin origin = 1;
  uint32 worker_id = 2;
}

// A probing task, containing the target address to probe and the origin ID with which to send the probe
message Probe {
  Address dst = 1; // target address of the probe
}

// A traceroute task, containing a destination address, the TTL value to use, the protocol type, and the origin to use
message Trace {
  Address dst = 1; // target address of the traceroute probe
  uint32 ttl = 2; // TTL to use for the traceroute probe
}

// A ReplyBatch, contains the worker that received the measurement replies, and the replies themselves
message ReplyBatch {
  uint32 rx_id = 1;
  repeated Reply results = 2; // forwarded to CLI by the Orchestrator
  uint32 origin_id = 3; // Origin associated with the replies
}

// Single reply
message Reply {
  oneof reply_data {
    MeasurementReply measurement = 1; // result
    DiscoveryReply discovery = 2; // follow-up
    TraceReply trace = 3; // result + follow-up
  }
}

// Contains discovery reply data (used for follow-up tasks)
message DiscoveryReply {
  Address src = 1;
}

// Contains measured reply data (forwarded to the CLI and written to file)
message MeasurementReply {
  Address src = 1;
  uint32 ttl = 2;
  float rtt = 3; // Round-trip time in milliseconds
  uint32 tx_id = 4;
  optional string chaos = 5;
  optional RecordedHops recorded_hops = 6;
}

// Traceroute reply
message TraceReply {
  Address hop_addr = 1;
  uint32 ttl = 2;
  float rtt = 3; // round-trip time in milliseconds
  uint32 tx_id = 4;
  Address trace_dst = 5;
  uint32 hop_count = 6; // TTL used to trigger this reply
}

// Record Route hops found
message RecordedHops {
  repeated Address hops = 1;
}