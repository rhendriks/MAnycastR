name: Bug report
description: Report something that does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug :)
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where does the problem occur?
      multiple: true
      options:
        - orchestrator
        - worker
        - cli
        - output (CSV / Parquet)
        - not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `manycastr --version`
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Release binary
        - Docker image
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g., Ubuntu 24.04, x86_64
  - type: textarea
    id: command
    attributes:
      label: Command and configuration
      description: The exact command(s) you ran and relevant config / hitlist excerpts. Remove any private addresses, hostnames or credentials.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output from the orchestrator, worker(s) and/or CLI.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Measurement type (ICMP/UDP/TCP, IPv4/IPv6), number of workers, TLS enabled, etc.
