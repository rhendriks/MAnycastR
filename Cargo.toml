[package]
name = "manycastr"
version = "1.5.1"
edition = "2021"

[dependencies]
byteorder = "1.5.0"# convert between byte arrays and integers
chrono = "0.4.44"# get current time
clap = "4.6.1"# parse command line arguments
csv = "1.4.0" # write to CSV
futures-core = "0.3.32" # async runtime
prettytable-rs = "0.10.0" # print worker-list
prost = "0.14.3" # define gRPC messages
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] } # async runtime
tonic = { version = "0.14.6", features = ["tls-ring", "zstd"] } # gRPC (inter-component communication)
rand = "0.10.1" # generate random numbers
gethostname = "1.1.0" # get hostname
socket2 = { version = "0.6.3", features = ["all"] }
local-ip-address = "0.6.13" # get local unicast address
indicatif = "0.18.4" # progress bar
ratelimit_meter = "5.0.0" # rate limit
flate2 = "1.1.9" # compression
bimap = "0.6.3"
tonic-prost = "0.14.6"
parquet = { version = "58.3.0", features = ["snap"]}
serde_json = "1.0.149"
log = "0.4.29"
pretty_env_logger = "0.5.0"
[build-dependencies]
tonic-prost-build = "0.14.6"

[profile.release]
opt-level = 3         # maximize for performance
lto = "fat"           # link-time optimization
codegen-units = 1     # compiling optimization
panic = "abort"       # remove stack unwinding code
strip = true          # reduce binary size
